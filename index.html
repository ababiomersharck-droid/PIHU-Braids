<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- viewport-fit=cover lets the page use the full iPhone screen; the CSS then keeps content clear of the notch -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a110d" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@400;500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <!-- TODO: replace "Braids" with the studio's full business name -->
    <title>Braids | Beauty in Every Strand. Book your appointment</title>
    <meta
      name="description"
      content="Premium braiding studio. Browse signature styles, see prices and book your appointment online."
    />

    <!-- Social sharing (WhatsApp, Instagram, Facebook).
         TODO after deploying: replace YOUR-SITE-URL with the real address, e.g. https://yourname.vercel.app -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Braids | Beauty in Every Strand" />
    <meta property="og:description" content="Browse signature braid styles and book your appointment online." />
    <meta property="og:image" content="https://pihu-braids.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://pihu-braids.vercel.app/og-image.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
